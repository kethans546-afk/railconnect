<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Trains — RAILCONNECT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      🚆 <span>RAILCONNECT</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" data-i18n="nav.home">Home</a></li>
      <li><a href="search-trains.html" class="active" data-i18n="nav.search">Search Trains</a></li>
      <li><a href="pnr-status.html" data-i18n="nav.pnr">PNR Status</a></li>
      <li><a href="weather-alert.html" data-i18n="nav.weather">Weather Alerts</a></li>
      <li><a href="berth-exchange.html" data-i18n="nav.berthExchange">Berth Exchange</a></li>
      <li><a href="booking-history.html" data-i18n="nav.bookings">My Bookings</a></li>
    </ul>
    <div class="nav-actions"></div>
  </nav>

  <div class="container">
    <!-- Top Filter Bar -->
    <div class="card" style="padding: 18px 24px;">
      <form id="trainSearchForm" onsubmit="executeSearch(event)" class="form-row" style="align-items: flex-end;">
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">Origin Station</label>
          <input type="text" id="fromStation" list="stationList" class="form-control" placeholder="Station Code or City (e.g. SBC, TPJ, NDLS)" value="SBC" required>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">Destination Station</label>
          <input type="text" id="toStation" list="stationList" class="form-control" placeholder="Station Code or City (e.g. MAS, MS, BCT)" value="MAS" required>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">Journey Date</label>
          <input type="date" id="journeyDate" class="form-control" required>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">Class Filter</label>
          <select id="classFilter" class="form-control" onchange="filterResults()">
            <option value="ALL">All Classes</option>
            <option value="EC">Executive Chair Car (EC)</option>
            <option value="CC">AC Chair Car (CC)</option>
            <option value="3A">AC 3 Tier (3A)</option>
            <option value="2A">AC 2 Tier (2A)</option>
            <option value="1A">AC First Class (1A)</option>
            <option value="SL">Sleeper (SL)</option>
          </select>
        </div>
        <div>
          <button type="submit" class="btn btn-primary" style="height: 42px; width: 100%;">
            🔍 Update Results
          </button>
        </div>
      </form>

      <!-- Autocomplete Datalist -->
      <datalist id="stationList">
        <option value="SBC">KSR Bengaluru City (SBC)</option>
        <option value="MAS">Chennai Central (MAS)</option>
        <option value="MS">Chennai Egmore (MS)</option>
        <option value="TPJ">Tiruchchirappalli / Trichy (TPJ)</option>
        <option value="NDLS">New Delhi (NDLS)</option>
        <option value="BCT">Mumbai Central (BCT)</option>
        <option value="CSMT">Chhatrapati Shivaji Terminus (CSMT)</option>
        <option value="HWH">Howrah Junction / Kolkata (HWH)</option>
        <option value="HYB">Hyderabad Deccan (HYB)</option>
        <option value="SC">Secunderabad Junction (SC)</option>
        <option value="KPD">Katpadi Junction (KPD)</option>
        <option value="CBE">Coimbatore Junction (CBE)</option>
        <option value="MYS">Mysuru Junction (MYS)</option>
        <option value="PUNE">Pune Junction (PUNE)</option>
        <option value="JP">Jaipur Junction (JP)</option>
        <option value="ADI">Ahmedabad Junction (ADI)</option>
        <option value="BSB">Varanasi Junction (BSB)</option>
        <option value="TVC">Thiruvananthapuram Central (TVC)</option>
      </datalist>

      <!-- Popular Route Quick-Select Pills -->
      <div style="margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
        <span style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Quick Corridors:</span>
        <button type="button" class="btn btn-secondary btn-sm" style="font-size:0.75rem; padding:4px 10px;" onclick="quickSearch('SBC', 'MAS')">⚡ Bengaluru ➔ Chennai (SBC-MAS)</button>
        <button type="button" class="btn btn-secondary btn-sm" style="font-size:0.75rem; padding:4px 10px;" onclick="quickSearch('TPJ', 'MAS')">🚆 Trichy ➔ Chennai (TPJ-MAS)</button>
        <button type="button" class="btn btn-secondary btn-sm" style="font-size:0.75rem; padding:4px 10px;" onclick="quickSearch('NDLS', 'BCT')">👑 Delhi ➔ Mumbai (NDLS-BCT)</button>
        <button type="button" class="btn btn-secondary btn-sm" style="font-size:0.75rem; padding:4px 10px;" onclick="quickSearch('HWH', 'NDLS')">⭐ Kolkata ➔ Delhi (HWH-NDLS)</button>
        <button type="button" class="btn btn-secondary btn-sm" style="font-size:0.75rem; padding:4px 10px;" onclick="quickSearch('MAS', 'MYS')">⚡ Chennai ➔ Mysuru (MAS-MYS)</button>
        <button type="button" class="btn btn-secondary btn-sm" style="font-size:0.75rem; padding:4px 10px;" onclick="quickSearch('', '')">🌐 View All 21 Trains</button>
      </div>
    </div>

    <!-- Live Weather Alert Banner for this search -->
    <div id="routeWeatherBanner" style="display:none;" class="weather-card"></div>

    <!-- Results Status Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <div>
        <h2 id="searchResultsTitle" style="font-size: 1.4rem; font-weight: 800; color: var(--primary);">Available Trains</h2>
        <p id="searchResultsSub" style="color: var(--text-muted); font-size: 0.85rem;">Showing operational schedules with live seat inventory</p>
      </div>
      <div style="font-size: 0.85rem; color: var(--text-muted);">
        Sort by: <strong style="color: var(--primary);">Departure Time</strong>
      </div>
    </div>

    <!-- Train Cards Container -->
    <div id="trainsList">
      <div style="text-align: center; padding: 40px; color: var(--text-muted);">
        Loading scheduled trains from backend...
      </div>
    </div>
  </div>

  <script src="js/railconnect-mock-engine.js"></script>
  <script src="js/seat-layout-engine.js"></script>
  <script src="js/journey-assistant.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ai-assistant.js"></script>
  <script>
    let rawTrainResults = [];

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const from = urlParams.get('from') || 'SBC';
      const to = urlParams.get('to') || 'MAS';
      let date = urlParams.get('date');

      if (!date) {
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 2);
        date = tomorrow.toISOString().split('T')[0];
      }

      document.getElementById('fromStation').value = from;
      document.getElementById('toStation').value = to;
      document.getElementById('journeyDate').value = date;

      loadTrains(from, to, date);
      loadRouteWeather(from, to, date);
    });

    async function executeSearch(e) {
      if (e) e.preventDefault();
      const from = document.getElementById('fromStation').value.trim();
      const to = document.getElementById('toStation').value.trim();
      const date = document.getElementById('journeyDate').value;
      loadTrains(from, to, date);
      loadRouteWeather(from, to, date);
    }

    async function loadRouteWeather(from, to, date) {
      try {
        const w = await Api.getJourneyWeather(from, to, date);
        const banner = document.getElementById('routeWeatherBanner');
        banner.className = `weather-card severity-${w.destinationWeather.severity}`;
        banner.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <div>
              <span class="badge ${w.destinationWeather.severity === 'WARNING' || w.destinationWeather.severity === 'SEVERE' ? 'badge-danger' : 'badge-success'}">
                ${w.destinationWeather.severity} Alert
              </span>
              <strong style="margin-left: 8px;">Destination Weather: ${w.destinationWeather.stationName}</strong>
              <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">
                ${w.destinationWeather.condition} • Temp: ${w.destinationWeather.temperatureC}°C • Rain Probability: ${w.destinationWeather.rainProbability}%
              </div>
            </div>
            <div style="text-align:right;">
              <span class="badge badge-saffron">${w.banner}</span>
              <div style="font-size: 0.8rem; color: var(--text-muted); margin-top:4px;">
                <a href="weather-alert.html?from=${from}&to=${to}&date=${date}">Full Weather Telemetry ➔</a>
              </div>
            </div>
          </div>
        `;
        banner.style.display = 'block';
      } catch (e) {
        console.warn('Weather fetch error:', e);
      }
    }

    async function loadTrains(from, to, date) {
      const container = document.getElementById('trainsList');
      container.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-muted);">Fetching train routes & availability...</div>';

      try {
        let trains = await Api.searchTrains(from, to, date);
        if (!trains || trains.length === 0) {
          // Fallback to all available trains across network so screen is never blank
          try {
            trains = await Api.getAllTrains();
          } catch (e) {
            console.warn('Fallback all trains failed', e);
          }
        }
        rawTrainResults = trains || [];
        renderTrains(rawTrainResults);
      } catch (err) {
        console.warn('Direct search failed, checking offline fleet:', err);
        try {
          const fleet = await Api.getAllTrains();
          rawTrainResults = fleet || [];
          renderTrains(rawTrainResults);
        } catch (e) {
          container.innerHTML = `
            <div class="card" style="text-align:center; padding:40px;">
              <p style="color:var(--danger); font-weight:600;">Unable to load trains: ${err.message}</p>
              <p style="color:var(--text-muted); font-size:0.85rem; margin-top:8px;">Showing offline fallback fleet. Refresh or check connection.</p>
              <button onclick="quickSearch('SBC', 'MAS')" class="btn btn-primary btn-sm" style="margin-top:12px;">Load Bengaluru ➔ Chennai Trains</button>
            </div>
          `;
        }
      }
    }

    function quickSearch(from, to) {
      document.getElementById('fromStation').value = from;
      document.getElementById('toStation').value = to;
      const date = document.getElementById('journeyDate').value;
      loadTrains(from, to, date);
      if (from && to) {
        loadRouteWeather(from, to, date);
      }
    }

    function renderTrains(trains) {
      const container = document.getElementById('trainsList');
      if (!trains || trains.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align:center; padding:40px;">
            <p style="font-size:1.15rem; font-weight:800; color:var(--primary);">No direct trains found for this route.</p>
            <p style="color:var(--text-muted); font-size:0.9rem; margin-top:6px;">Select one of our popular high-speed corridors below:</p>
            <div style="display:flex; justify-content:center; gap:10px; margin-top:16px; flex-wrap:wrap;">
              <button class="btn btn-secondary btn-sm" onclick="quickSearch('SBC', 'MAS')">⚡ Bengaluru ➔ Chennai</button>
              <button class="btn btn-secondary btn-sm" onclick="quickSearch('TPJ', 'MAS')">🚆 Trichy ➔ Chennai</button>
              <button class="btn btn-secondary btn-sm" onclick="quickSearch('NDLS', 'BCT')">👑 Delhi ➔ Mumbai</button>
              <button class="btn btn-secondary btn-sm" onclick="quickSearch('', '')">🌐 Show All 21 Trains</button>
            </div>
          </div>
        `;
        return;
      }

      const date = document.getElementById('journeyDate').value;
      const classFilter = document.getElementById('classFilter').value;

      container.innerHTML = trains.map(t => {
        const tid = t.trainId || t.id || 1;
        const availableClasses = (t.availableClasses && t.availableClasses.length > 0)
          ? t.availableClasses
          : [
              { coachType: '3A', availableSeats: 48, fare: 650.0, status: 'AVAILABLE (48)' },
              { coachType: '2A', availableSeats: 24, fare: 1100.0, status: 'AVAILABLE (24)' },
              { coachType: 'SL', availableSeats: 120, fare: 280.0, status: 'AVAILABLE (120)' }
            ];

        const filteredClasses = classFilter === 'ALL'
          ? availableClasses
          : availableClasses.filter(c => c.coachType === classFilter);

        const classButtons = filteredClasses.map(c => `
          <div style="border:1px solid var(--border); border-radius:var(--radius-md); padding:10px 14px; background:#fff; text-align:center; min-width:110px;">
            <div style="font-weight:800; color:var(--primary); font-size:0.95rem;">${c.coachType}</div>
            <div style="font-weight:700; color:var(--accent-green); font-size:0.85rem; margin-top:2px;">₹${(c.fare || 550).toFixed(2)}</div>
            <div style="font-size:0.75rem; color: ${(c.availableSeats || 10) > 0 ? 'var(--accent-green)' : 'var(--warning)'}; font-weight:600; margin-top:2px;">
              ${c.status || 'AVAILABLE'}
            </div>
            <button class="btn btn-primary btn-sm" style="margin-top:8px; width:100%;"
              onclick="startBooking(${tid}, '${t.trainNumber}', '${t.trainName}', '${c.coachType}', ${c.fare || 550}, '${t.fromStationCode || 'SBC'}', '${t.toStationCode || 'MAS'}', '${date}')">
              Select
            </button>
          </div>
        `).join('');

        return `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
              <div>
                ${t.trainType === 'VANDE_BHARAT' ? '<span class="badge" style="background: linear-gradient(135deg, #E27D60 0%, #C53030 100%); color: white; font-weight: 800;">⚡ VANDE BHARAT</span>' : `<span class="badge badge-info">${t.trainType || 'EXPRESS'}</span>`}
                <span style="font-weight:800; font-size:1.15rem; color:var(--primary); margin-left:6px;">${t.trainNumber}</span>
                <span style="font-weight:700; font-size:1.15rem; color:var(--text-main); margin-left:6px;">${t.trainName}</span>
                <div style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">
                  Runs on: <strong>${t.runningDays || 'Daily'}</strong> • Distance: <strong>${t.distanceKm || 350} km</strong>
                </div>
              </div>
              <div>
                <a href="train-details.html?trainId=${tid}" class="btn btn-secondary btn-sm">
                  View Timetable & Route Stops ➔
                </a>
              </div>
            </div>

            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:16px; background:var(--bg-subtle); padding:16px; border-radius:var(--radius-md); margin-bottom:16px; text-align:center;">
              <div>
                <div style="font-size:0.75rem; color:var(--text-muted); font-weight:700; text-transform:uppercase;">Departure</div>
                <div style="font-size:1.25rem; font-weight:800; color:var(--text-main);">${t.departureTime || '06:00'}</div>
                <div style="font-size:0.8rem; color:var(--primary); font-weight:600;">${t.fromStationName || t.fromStationCode || 'Origin'}</div>
              </div>
              <div style="display:flex; flex-direction:column; justify-content:center; align-items:center;">
                <span style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">${t.durationHours || 4.5} hrs</span>
                <div style="width:80%; height:2px; background:var(--border); margin:4px 0;"></div>
                <span style="font-size:0.7rem; color:var(--accent-green); font-weight:700;">Direct Route</span>
              </div>
              <div>
                <div style="font-size:0.75rem; color:var(--text-muted); font-weight:700; text-transform:uppercase;">Arrival</div>
                <div style="font-size:1.25rem; font-weight:800; color:var(--text-main);">${t.arrivalTime || '11:00'}</div>
                <div style="font-size:0.8rem; color:var(--primary); font-weight:600;">${t.toStationName || t.toStationCode || 'Destination'}</div>
              </div>
            </div>

            <!-- Class availability cards -->
            <div style="display:flex; gap:12px; overflow-x:auto; padding-bottom:6px;">
              ${classButtons}
            </div>
          </div>
        `;
      }).join('');
    }

    function filterResults() {
      renderTrains(rawTrainResults);
    }

    function startBooking(trainId, trainNumber, trainName, coachType, fare, from, to, date) {
      // Store selected booking state in sessionStorage for smooth checkout pipeline
      sessionStorage.setItem('rc_trainId', trainId);
      sessionStorage.setItem('rc_trainNumber', trainNumber);
      sessionStorage.setItem('rc_trainName', trainName);
      sessionStorage.setItem('rc_coachType', coachType);
      sessionStorage.setItem('rc_fare', fare);
      sessionStorage.setItem('rc_from', from);
      sessionStorage.setItem('rc_to', to);
      sessionStorage.setItem('rc_date', date);

      window.location.href = `seat-selection.html?trainId=${trainId}&coachType=${coachType}&date=${date}`;
    }
  </script>
</body>
</html>
